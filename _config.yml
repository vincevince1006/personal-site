# Site settings

title: vnncctt.com
email: vincevince1006@gmail.com
description: >- # this means to ignore newlines
  Portfolio site to showcase the work I've done across my UI/UX career, so far.
baseurl: "/" # the subpath of your site
url: "https://vnncct.com"
github_username: vincevince1006
lang: "en-US"

# collections, set default and output for markdown files
collections_dir: my_collections
collections:
  projects:
    output: true

# Build settings
plugins:
  - jekyll-feed
  - jekyll-postcss

postcss:
  cache: false

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
   - .sass-cache/
   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
   - Gemfile.lock
   - todo.md
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
